<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rock paper Scissors</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <section class="container">
      <div class="header">
        <p>&copy;2025 <a href="#">Biwott</a></p>
      <div class="scores">
        <div class="scoreDisplay">
          Player <span id="playerScore">0</span>
        </div>
        <div class="scoreDisplay">
          Computer <span id="computerScore">0</span>
        </div>
      </div>
      </div>
      <div id="output">
        <p id="computerDisplay">
          Computer <br />
          <span id="computerIcon"> &#9996; </span>
        </p>
        <p id="resultDisplay"></p>
        <p id="playerDisplay">
          Player <br />
          <span id="playerIcon"> &#9996; </span>
        </p>
      </div>

      <div id="play">
        <button onclick="playGame('rock')">&#9994; <br />Rock</button>
        <button onclick="playGame('paper')">&#9995; <br />Paper</button>
        <button onclick="playGame('scissors')">
          &#9996; <br />
          Scissors
        </button>
      </div>
    </section>

    <script src="src/main.js"></script>
  </body>
</html>
